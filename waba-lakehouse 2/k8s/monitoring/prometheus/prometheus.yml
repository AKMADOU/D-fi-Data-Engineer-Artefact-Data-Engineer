# Prometheus — collecte des métriques de la plateforme WABA (Level 4).
# 1) Découverte Kubernetes : tout pod annoté prometheus.io/scrape="true"
#    (MinIO, Spark Operator, drivers Spark Structured Streaming, Keycloak,
#    OpenMetadata, Loki, Grafana...) ;
# 2) Exporters : statsd-exporter (Airflow), kafka-exporter (offsets, consumer groups),
#    Pushgateway (état des DAGs) ;
# 3) Trino : /metrics exige une authentification -> compte de service « prometheus ».
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {cluster: waba-minikube}

scrape_configs:
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Succeeded|Failed)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_spark_role]
        target_label: spark_role

  - job_name: trino
    scheme: https
    tls_config: {insecure_skip_verify: true}     # certificat auto-signé du cluster
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/trino-password
    static_configs:
      - targets: [trino.serving.svc.cluster.local:8443]
        labels: {app: trino, namespace: serving}

  - job_name: airflow-statsd
    static_configs:
      - targets: [statsd-exporter.monitoring.svc.cluster.local:9102]
        labels: {app: airflow, namespace: processing}

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter.monitoring.svc.cluster.local:9308]
        labels: {app: kafka, namespace: ingestion}

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway.monitoring.svc.cluster.local:9091]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
