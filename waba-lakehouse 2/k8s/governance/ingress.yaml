apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: governance
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k    # en-têtes OIDC volumineux
spec:
  ingressClassName: nginx
  tls:
    - hosts: [keycloak.waba.local, openmetadata.waba.local]
      secretName: waba-tls
  rules:
    - host: keycloak.waba.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
    - host: openmetadata.waba.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: openmetadata, port: {number: 8585}}}}
