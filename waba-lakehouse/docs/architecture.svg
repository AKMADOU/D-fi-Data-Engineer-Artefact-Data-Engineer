<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .s{font-size:12px;fill:#334155;text-anchor:middle}
      .lane{font-size:13px;font-weight:700;letter-spacing:1px}
      .line{stroke:#475569;stroke-width:2;fill:none}
    </style>
  </defs>

  <!-- fond -->
  <rect width="1280" height="640" fill="#ffffff"/>
  <text x="640" y="38" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">WABA Group — Data Lakehouse multi-pays (architecture Lambda)</text>
  <text x="640" y="62" font-size="13" fill="#64748b" text-anchor="middle">8 pays · banque, assurance, mobile money · XOF / GHS → EUR · BCEAO / CIMA</text>

  <!-- couloirs -->
  <rect x="290" y="88" width="660" height="185" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="306" y="110" class="lane" fill="#1d4ed8">BATCH LAYER · orchestrée par Airflow 3 (toutes les 15 min + J+1)</text>
  <rect x="290" y="296" width="660" height="185" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="306" y="318" class="lane" fill="#c2410c">SPEED LAYER · quasi-temps réel (micro-lots de 5 s)</text>

  <!-- sources -->
  <rect x="30" y="236" width="110" height="70" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="266" class="t">Streamlit</text>
  <text x="85" y="285" class="s">générateur</text>

  <rect x="168" y="226" width="100" height="90" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="218" y="258" class="t">MinIO</text>
  <text x="218" y="277" class="s">raw-landing</text>
  <text x="218" y="294" class="s">(CSV)</text>
  <line x1="140" y1="271" x2="166" y2="271" class="line" marker-end="url(#arr)"/>

  <!-- batch -->
  <rect x="310" y="135" width="120" height="70" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="370" y="165" class="t">Spark</text>
  <text x="370" y="184" class="s">validation · MERGE</text>

  <rect x="460" y="135" width="130" height="70" class="box" fill="#f5e6d3" stroke="#a16207"/>
  <text x="525" y="165" class="t">Bronze</text>
  <text x="525" y="184" class="s">brut validé</text>

  <rect x="620" y="135" width="130" height="70" class="box" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="685" y="165" class="t">Silver</text>
  <text x="685" y="184" class="s">EUR · pseudonymisé</text>

  <rect x="780" y="135" width="150" height="70" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="855" y="160" class="t">Gold</text>
  <text x="855" y="178" class="s">7 KPIs</text>
  <text x="855" y="194" class="s">BCEAO / CIMA J+1</text>

  <line x1="430" y1="170" x2="458" y2="170" class="line" marker-end="url(#arr)"/>
  <line x1="590" y1="170" x2="618" y2="170" class="line" marker-end="url(#arr)"/>
  <line x1="750" y1="170" x2="778" y2="170" class="line" marker-end="url(#arr)"/>
  <text x="620" y="245" class="s" fill="#1d4ed8">tables Apache Iceberg · partitions pays × date · idempotent</text>

  <!-- streaming -->
  <rect x="310" y="345" width="110" height="70" class="box" fill="#ffffff" stroke="#ea580c"/>
  <text x="365" y="375" class="t">NiFi</text>
  <text x="365" y="394" class="s">CSV → JSON</text>

  <rect x="445" y="345" width="120" height="70" class="box" fill="#ffffff" stroke="#ea580c"/>
  <text x="505" y="375" class="t">Kafka</text>
  <text x="505" y="394" class="s">raw-* · silver-*</text>

  <rect x="590" y="345" width="160" height="70" class="box" fill="#ffffff" stroke="#ea580c"/>
  <text x="670" y="370" class="t">Spark Streaming</text>
  <text x="670" y="388" class="s">Job 1 : nettoyage</text>
  <text x="670" y="404" class="s">Job 2 : détection</text>

  <rect x="780" y="340" width="150" height="80" class="box" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="855" y="366" class="t">Alertes Gold</text>
  <text x="855" y="385" class="s">fraude · AML</text>
  <text x="855" y="401" class="s">liquidité</text>

  <line x1="420" y1="380" x2="443" y2="380" class="line" marker-end="url(#arr)"/>
  <line x1="565" y1="380" x2="588" y2="380" class="line" marker-end="url(#arr)"/>
  <line x1="750" y1="380" x2="778" y2="380" class="line" marker-end="url(#arr)"/>
  <text x="620" y="455" class="s" fill="#c2410c">déduplication 10 min · fenêtres glissantes 5 min · DLQ des rejets</text>

  <!-- MinIO vers les deux couches -->
  <path d="M268,255 C285,255 285,170 308,170" class="line" marker-end="url(#arr)"/>
  <path d="M268,287 C285,287 285,380 308,380" class="line" marker-end="url(#arr)"/>

  <!-- serving -->
  <rect x="990" y="200" width="120" height="96" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1050" y="235" class="t">Trino</text>
  <text x="1050" y="254" class="s">SQL fédéré</text>
  <text x="1050" y="271" class="s">Iceberg + Kafka</text>

  <rect x="1140" y="200" width="115" height="96" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1197" y="235" class="t">Superset</text>
  <text x="1197" y="254" class="s">3 dashboards</text>
  <text x="1197" y="271" class="s">filtre pays</text>

  <path d="M930,170 C960,170 960,235 988,235" class="line" marker-end="url(#arr)"/>
  <path d="M930,380 C960,380 960,262 988,262" class="line" marker-end="url(#arr)"/>
  <line x1="1110" y1="248" x2="1138" y2="248" class="line" marker-end="url(#arr)"/>
  <text x="1050" y="322" class="s" fill="#6d28d9">requête Lambda :</text>
  <text x="1050" y="338" class="s" fill="#6d28d9">batch + streaming</text>

  <!-- socle -->
  <rect x="30" y="510" width="1225" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="533" class="lane" fill="#334155">SOCLE · Kubernetes (5 namespaces : ingestion, processing, serving, governance, monitoring)</text>

  <rect x="48" y="545" width="280" height="54" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="188" y="568" class="t">Catalogue Iceberg REST</text>
  <text x="188" y="586" class="s">métadonnées des tables · stockage MinIO</text>

  <rect x="346" y="545" width="270" height="54" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="481" y="568" class="t">Keycloak · SSO</text>
  <text x="481" y="586" class="s">4 rôles · filtres pays et masques (Trino)</text>

  <rect x="634" y="545" width="290" height="54" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="779" y="568" class="t">OpenMetadata</text>
  <text x="779" y="586" class="s">catalogue · tags PII · lineage raw → Gold</text>

  <rect x="942" y="545" width="295" height="54" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1089" y="568" class="t">Prometheus · Loki · Grafana</text>
  <text x="1089" y="586" class="s">santé des pipelines · 3 alertes</text>
</svg>
