# Kafka 4.3 en KRaft (broker + contrôleur, 1 nœud). Sondes : readiness = API broker
# joignable, liveness = port d'écoute ouvert.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels: {app: kafka}
spec:
  clusterIP: None
  publishNotReadyAddresses: true      # le quorum KRaft doit se résoudre avant d'être prêt
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless.ingestion.svc.cluster.local:9092"
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.ingestion.svc.cluster.local:9093"
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qg}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx1g"}
          ports:
            - {containerPort: 9092, name: broker}
            - {containerPort: 9093, name: controller}
          startupProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              # JVM de la sonde limitée (sinon elle hérite de KAFKA_HEAP_OPTS du broker)
              command: ["sh", "-c", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
# Création idempotente des 12 topics (même script que docker compose)
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.3.1
          command: ["bash", "/scripts/create-topics.sh"]
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka.ingestion.svc.cluster.local:9092"}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: kafka-topics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels: {app: kafka-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-ui}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      containers:
        - name: kafka-ui
          image: kafbat/kafka-ui:v1.5.0
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: waba}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.ingestion.svc.cluster.local:9092"}
            - {name: DYNAMIC_CONFIG_ENABLED, value: "false"}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector: {app: kafka-ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
