apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: serving
labels:
  - pairs: {app.kubernetes.io/part-of: waba, waba/domain: serving}
    includeSelectors: false
resources:
  - trino.yaml
  - superset.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: trino-config
    files:
      - trino/config.properties
      - trino/jvm.config
      - trino/node.properties
      - trino/access-control.properties
      - trino/group-provider.properties
      - trino/password-authenticator.properties
  - name: trino-catalogs
    files:
      - trino/iceberg.properties
      - trino/kafka.properties
  - name: trino-access
    files:
      - trino/rules.json
      - trino/group.txt
