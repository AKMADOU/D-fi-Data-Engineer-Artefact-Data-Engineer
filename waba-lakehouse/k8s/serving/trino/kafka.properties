# Connecteur Kafka de Trino : lecture des topics du Level 3 (vue « speed layer » de la
# requête Lambda). Les colonnes des messages JSON sont décrites dans /etc/trino/kafka/*.json.
connector.name=kafka
kafka.nodes=kafka.ingestion.svc.cluster.local:9092
kafka.default-schema=default
kafka.table-description-dir=/etc/trino/kafka
kafka.table-names=raw-bank-transactions,raw-insurance-operations,raw-mobile-money-payments,raw-loan-repayments,silver-bank-transactions,silver-insurance-operations,silver-mobile-money,silver-loan-repayments,gold-fraud-alerts,gold-aml-events,gold-liquidity-alerts,dlq-financial-events
kafka.hide-internal-columns=true
