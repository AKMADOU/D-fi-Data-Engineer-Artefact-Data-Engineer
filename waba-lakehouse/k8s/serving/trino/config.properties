# Trino 460 — coordinateur unique (ordonnance aussi les tâches), Level 4.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
query.max-memory=1GB
query.max-memory-per-node=1GB

# HTTP : communication interne et sondes. HTTPS : clients (Superset, DBeaver, UI, Prometheus).
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.pem
# L'Ingress ajoute X-Forwarded-* : sans cette option Trino rejette la requête
http-server.process-forwarded=true
# Obligatoire dès qu'une authentification est active
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# Humains : SSO Keycloak (OAuth 2.0 / OIDC). Comptes de service : mot de passe (fichier PBKDF2).
http-server.authentication.type=OAUTH2,PASSWORD
web-ui.authentication.type=OAUTH2
http-server.authentication.oauth2.issuer=https://keycloak.waba.local/realms/waba
# Découverte désactivée : le navigateur passe par l'URL publique, Trino par l'URL interne
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.auth-url=https://keycloak.waba.local/realms/waba/protocol/openid-connect/auth
http-server.authentication.oauth2.token-url=http://keycloak.governance.svc.cluster.local:8080/realms/waba/protocol/openid-connect/token
http-server.authentication.oauth2.jwks-url=http://keycloak.governance.svc.cluster.local:8080/realms/waba/protocol/openid-connect/certs
http-server.authentication.oauth2.oidc.use-userinfo-endpoint=false
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
http-server.authentication.oauth2.principal-field=preferred_username
http-server.authentication.oauth2.scopes=openid,profile,email

