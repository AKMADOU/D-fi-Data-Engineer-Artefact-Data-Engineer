# Profil léger (machine 16 Go) : tas JVM, requêtes et limites mémoire réduits.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ingestion
spec:
  template:
    spec:
      containers:
      - name: kafka
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 1Gi
        env:
        - name: KAFKA_HEAP_OPTS
          value: -Xms256m -Xmx512m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: ingestion
spec:
  template:
    spec:
      containers:
      - name: nifi
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
          limits:
            memory: 1536Mi
        env:
        - name: NIFI_JVM_HEAP_INIT
          value: 512m
        - name: NIFI_JVM_HEAP_MAX
          value: 1g
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ingestion
spec:
  template:
    spec:
      containers:
      - name: minio
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: apps/v1
