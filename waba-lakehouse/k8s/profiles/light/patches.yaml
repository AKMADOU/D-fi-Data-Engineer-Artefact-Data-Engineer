---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-silver
  namespace: processing
spec:
  template:
    spec:
      containers:
      - name: driver
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
          limits:
            memory: 1536Mi
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 900m
        - --conf
        - spark.sql.shuffle.partitions=4
        - /opt/waba/jobs/stream_raw_to_silver.py
---
